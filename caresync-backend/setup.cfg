[flake8]
max-line-length = 100
exclude = .git,__pycache__,venv,migrations,staticfiles
extend-ignore = E203, W503

[isort]
profile = black
known_django = django
known_rest_framework = rest_framework
known_first_party = apps,caresync
sections = FUTURE,STDLIB,THIRDPARTY,DJANGO,REST_FRAMEWORK,FIRST_PARTY,LOCALFOLDER

[mypy]
python_version = 3.11
plugins = mypy_django_plugin.main
